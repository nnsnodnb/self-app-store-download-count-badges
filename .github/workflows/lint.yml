name: Lint

on:
  pull_request:
    paths:
      - '.github/workflows/*.yml'

jobs:
  actionlint:
    runs-on: ubuntu-26.04

    steps:
    - uses: actions/checkout@v7.0.1

    - name: actionlint
      uses: reviewdog/action-actionlint@v1.81.1
      with:
        github_token: ${{ secrets.github_token }}
        reporter: github-pr-review
        level: warning
